# Ejemplo para /etc/nginx/sites-available/criterio (enlazar en sites-enabled).
# Cambia criterio.ejemplo.com por tu dominio real.
server {
    listen 80;
    listen [::]:80;
    server_name criterio.ejemplo.com;

    # Adjuntos de hasta 5 MiB; 6m deja margen para el resto del formulario.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Después de: sudo certbot --nginx -d criterio.ejemplo.com
# certbot añade solo el bloque "listen 443 ssl" con los certificados y
# la redirección de HTTP a HTTPS. No hace falta escribirlo a mano.
